name: Destineer
description: 'Destineer was a networking-solutions provider for telecommunications carriers, and an early-stage
  Kleiner Perkins portfolio company partnered since 1995. Per Kleiner Perkins'' own partnerships archive,
  the company was acquired by MCI WorldCom and no longer operates as an independent entity. Enrichment
  probes in July 2026 found no live web presence: destineer.com, destineer.net, destineer.dev and destineer.us
  all return NXDOMAIN, there is no developer portal, documentation, or GitHub organization, and the APIs.io
  catalog lists no APIs for this provider. Because the company predates the public web API era and is
  defunct, no API, specification, SDK, or agent artifacts exist to harvest. This profile is retained as a
  historical portfolio record in the Kleiner Perkins investment graph rather than as an active API provider.
  Note: the unrelated video-game publisher of the same name (Minnetonka, MN, 2001-2011) and the individual
  github.com/destineer account are not this company.'
